name: Works Lab Daily Creative

on:
  workflow_dispatch:
  schedule:
    # 10:07 AM IST = 04:37 UTC. A non-round minute reduces GitHub schedule contention.
    - cron: "37 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate daily creative
        run: python scripts/generate_ad.py

      - name: Commit generated creative
        run: |
          git config user.name "works-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add generated_ads data
          git commit -m "chore: generate daily Works Lab creative" || echo "No changes"
          git push
