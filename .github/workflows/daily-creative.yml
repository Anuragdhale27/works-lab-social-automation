name: Works Lab Daily Instagram Post

on:
  workflow_dispatch:

  schedule:
    # 10:07 AM IST = 04:37 UTC
    - cron: "37 4 * * *"

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    env:
      TZ: "Asia/Kolkata"
      IG_API_VERSION: "v26.0"
      WA_API_VERSION: "v26.0"
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
      WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
      WA_RECIPIENT: ${{ secrets.WA_RECIPIENT }}
      WA_TEMPLATE_NAME: ${{ secrets.WA_TEMPLATE_NAME }}

    steps:

      # ---------------------------------------------------
      # 1. Checkout repository
      # ---------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v7

      # ---------------------------------------------------
      # 2. Setup Python
      # ---------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # ---------------------------------------------------
      # 3. Install dependencies
      # ---------------------------------------------------
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ---------------------------------------------------
      # 4. Generate today's creative
      # ---------------------------------------------------
      - name: Generate daily creative
        run: |
          python scripts/generate_ad.py

      # ---------------------------------------------------
      # 5. Set today's date
      # ---------------------------------------------------
      - name: Set date
        run: |
          set -euo pipefail
          echo "TODAY=$(TZ=Asia/Kolkata date +%Y-%m-%d)" >> "$GITHUB_ENV"
          echo "Using India date: $(TZ=Asia/Kolkata date +%Y-%m-%d)"

      # ---------------------------------------------------
      # 6. Commit generated image + metadata
      # ---------------------------------------------------
      - name: Commit generated creative
        run: |
          git config user.name "works-lab-bot"
          git config user.email "actions@users.noreply.github.com"

          git add generated_ads/

          if git diff --cached --quiet; then
            echo "No new files to commit."
          else
            git commit -m "chore: generate daily Works Lab creative"
            git push
          fi

      # ---------------------------------------------------
      # 7. Verify Instagram secrets
      # ---------------------------------------------------
      - name: Verify Instagram credentials
        run: |
          set -euo pipefail

          if [ -z "${IG_ACCESS_TOKEN:-}" ]; then
            echo "❌ IG_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "${IG_USER_ID:-}" ]; then
            echo "❌ IG_USER_ID is missing."
            exit 1
          fi

          echo "✅ Instagram secrets found."

      # ---------------------------------------------------
      # 8. Define public image URL
      # ---------------------------------------------------
      - name: Build public image URL
        run: |
          set -euo pipefail

          # Use the exact commit now checked out locally after the generated
          # creative has been committed. This avoids stale raw-GitHub caching.
          COMMIT_SHA=$(git rev-parse HEAD)
          IMAGE_URL="https://raw.githubusercontent.com/Anuragdhale27/works-lab-social-automation/${COMMIT_SHA}/generated_ads/daily-${TODAY}.jpg"

          echo "IMAGE_URL=$IMAGE_URL" >> "$GITHUB_ENV"
          echo "IMAGE_COMMIT_SHA=$COMMIT_SHA" >> "$GITHUB_ENV"

          echo "Public image URL:"
          echo "$IMAGE_URL"

      # ---------------------------------------------------
      # 9. Wait until GitHub raw URL is publicly available
      # ---------------------------------------------------
      - name: Verify public image URL
        run: |
          set -euo pipefail

          echo "Checking public image URL..."

          for i in {1..30}; do

            HTTP_CODE=$(curl \
              -L \
              -sS \
              -o /tmp/image.jpg \
              -w "%{http_code}" \
              "$IMAGE_URL")

            CONTENT_TYPE=$(file -b --mime-type /tmp/image.jpg || true)

            FILE_SIZE=$(wc -c < /tmp/image.jpg)

            echo "Attempt $i"
            echo "HTTP: $HTTP_CODE"
            echo "Type: $CONTENT_TYPE"
            echo "Size: $FILE_SIZE bytes"

            if [ "$HTTP_CODE" = "200" ] \
              && [ "$CONTENT_TYPE" = "image/jpeg" ] \
              && [ "$FILE_SIZE" -gt 10000 ]; then

              echo "✅ Public image is available."

              exit 0
            fi

            sleep 5

          done

          echo "❌ Public image was not available."
          exit 1

      # ---------------------------------------------------
      # 10. Read caption from metadata JSON
      # ---------------------------------------------------
      - name: Read Instagram metadata
        run: |
          set -euo pipefail

          METADATA_FILE="generated_ads/daily-${TODAY}.json"

          if [ ! -f "$METADATA_FILE" ]; then
            echo "❌ Metadata file not found:"
            echo "$METADATA_FILE"
            exit 1
          fi

          CAPTION=$(jq -r '.caption // empty' "$METADATA_FILE")
          HOOK=$(jq -r '.hook // empty' "$METADATA_FILE")

          if [ -z "$CAPTION" ] || [ -z "$HOOK" ]; then
            echo "❌ Caption or hook is missing from metadata."
            exit 1
          fi

          {
            echo "CAPTION<<EOF"
            echo "$CAPTION"
            echo "EOF"
          } >> "$GITHUB_ENV"

          echo "HOOK=$HOOK" >> "$GITHUB_ENV"
          echo "✅ Instagram metadata loaded."

      # ---------------------------------------------------
      # 11. Create Instagram media container
      # ---------------------------------------------------
      - name: Create Instagram media container
        id: container
        run: |
          set -euo pipefail

          echo "Creating Instagram media container..."
          echo "Image URL: $IMAGE_URL"

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION" \
            "https://graph.instagram.com/$IG_API_VERSION/$IG_USER_ID/media" \
            -o /tmp/container.json)

          echo "HTTP status: $HTTP_CODE"
          echo "Meta response:"
          cat /tmp/container.json
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Instagram media container request failed."
            exit 1
          fi

          CONTAINER_ID=$(jq -r '.id // empty' /tmp/container.json)

          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ Meta returned a success HTTP code but no container ID."
            exit 1
          fi

          echo "✅ Instagram container created."
          echo "CONTAINER_ID=$CONTAINER_ID" >> "$GITHUB_ENV"

      # ---------------------------------------------------
      # 12. Wait for Instagram processing
      # ---------------------------------------------------
      - name: Wait for Instagram container
        run: |
          set -euo pipefail

          for i in {1..18}; do

            HTTP_CODE=$(curl \
              --silent \
              --show-error \
              --write-out "%{http_code}" \
              -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
              "https://graph.instagram.com/$IG_API_VERSION/$CONTAINER_ID?fields=status_code,status" \
              -o /tmp/status.json)

            echo "HTTP: $HTTP_CODE"
            echo "Response:"
            cat /tmp/status.json

            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
              echo "❌ Instagram status request failed."
              exit 1
            fi

            STATUS=$(jq -r '.status_code // empty' /tmp/status.json)
            MESSAGE=$(jq -r '.status // empty' /tmp/status.json)

            echo "Attempt $i"
            echo "Status: $STATUS"
            echo "Message: $MESSAGE"

            case "$STATUS" in

              FINISHED)
                echo "✅ Instagram container is ready."
                exit 0
                ;;

              PUBLISHED)
                echo "✅ Instagram container already published."
                exit 0
                ;;

              ERROR|EXPIRED)
                echo "❌ Instagram container processing failed."
                cat /tmp/status.json
                exit 1
                ;;

            esac

            sleep 10

          done

          echo "❌ Instagram container did not finish."
          exit 1

      # ---------------------------------------------------
      # 13. Publish Instagram post
      # ---------------------------------------------------
      - name: Publish Instagram post
        run: |
          set -euo pipefail

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --write-out "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
            --data-urlencode "creation_id=$CONTAINER_ID" \
            "https://graph.instagram.com/$IG_API_VERSION/$IG_USER_ID/media_publish" \
            -o /tmp/published.json)

          echo "HTTP status: $HTTP_CODE"
          echo "Meta response:"
          cat /tmp/published.json
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ Instagram publish request failed."
            exit 1
          fi

          MEDIA_ID=$(jq -r '.id // empty' /tmp/published.json)

          if [ -z "$MEDIA_ID" ]; then
            echo "❌ Instagram media ID was not returned."
            exit 1
          fi

          echo "✅ Instagram post published successfully."
          echo "Media ID: $MEDIA_ID"


      # ---------------------------------------------------
      # 14. Send WhatsApp success notification
      # ---------------------------------------------------
      - name: Send WhatsApp notification
        run: |
          set -euo pipefail

          echo "Sending WhatsApp notification..."

          if [ -z "${WA_ACCESS_TOKEN:-}" ]; then
            echo "❌ WA_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "${WA_PHONE_NUMBER_ID:-}" ]; then
            echo "❌ WA_PHONE_NUMBER_ID is missing."
            exit 1
          fi

          if [ -z "${WA_RECIPIENT:-}" ]; then
            echo "❌ WA_RECIPIENT is missing."
            exit 1
          fi

          if [ -z "${WA_TEMPLATE_NAME:-}" ]; then
            echo "❌ WA_TEMPLATE_NAME is missing."
            exit 1
          fi

          PUBLISHED_AT=$(TZ=Asia/Kolkata date '+%-I:%M %p')

          PAYLOAD=$(jq -n             --arg to "$WA_RECIPIENT"             --arg template "$WA_TEMPLATE_NAME"             --arg hook "$HOOK"             --arg published_at "$PUBLISHED_AT"             '{
              messaging_product: "whatsapp",
              to: $to,
              type: "template",
              template: {
                name: $template,
                language: {
                  code: "en_US"
                },
                components: [
                  {
                    type: "body",
                    parameters: [
                      {
                        type: "text",
                        text: $hook
                      },
                      {
                        type: "text",
                        text: $published_at
                      }
                    ]
                  }
                ]
              }
            }')

          echo "WhatsApp template: $WA_TEMPLATE_NAME"
          echo "WhatsApp recipient configured."
          echo "Template variables: hook + published time"

          HTTP_CODE=$(curl             --silent             --show-error             --write-out "%{http_code}"             -X POST             -H "Authorization: Bearer $WA_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$PAYLOAD"             "https://graph.facebook.com/$WA_API_VERSION/$WA_PHONE_NUMBER_ID/messages"             -o /tmp/whatsapp.json)

          echo "HTTP status: $HTTP_CODE"
          echo "WhatsApp response:"
          cat /tmp/whatsapp.json
          echo

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "❌ WhatsApp notification failed."
            exit 1
          fi

          MESSAGE_ID=$(jq -r '.messages[0].id // empty' /tmp/whatsapp.json)

          if [ -z "$MESSAGE_ID" ]; then
            echo "❌ WhatsApp returned success HTTP status but no message ID."
            exit 1
          fi

          echo "✅ WhatsApp notification sent successfully."
          echo "Message ID: $MESSAGE_ID"
