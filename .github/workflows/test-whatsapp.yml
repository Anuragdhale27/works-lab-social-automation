name: Test WhatsApp Notification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-whatsapp:
    runs-on: ubuntu-latest

    env:
      WA_API_VERSION: "v26.0"
      WA_ACCESS_TOKEN: ${{ secrets.WA_ACCESS_TOKEN }}
      WA_PHONE_NUMBER_ID: ${{ secrets.WA_PHONE_NUMBER_ID }}
      WA_RECIPIENT: ${{ secrets.WA_RECIPIENT }}

    steps:

      - name: Verify WhatsApp secrets
        run: |
          set -euo pipefail

          if [ -z "${WA_ACCESS_TOKEN:-}" ]; then
            echo "❌ WA_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "${WA_PHONE_NUMBER_ID:-}" ]; then
            echo "❌ WA_PHONE_NUMBER_ID is missing."
            exit 1
          fi

          if [ -z "${WA_RECIPIENT:-}" ]; then
            echo "❌ WA_RECIPIENT is missing."
            exit 1
          fi

          echo "✅ WhatsApp secrets found."
          echo "Phone Number ID configured."
          echo "Recipient configured."

      - name: Send WhatsApp test message
        run: |
          set -u

          # Normalize recipient to international digits only.
          RECIPIENT=$(printf '%s' "$WA_RECIPIENT" | tr -d ' +()-')

          if ! printf '%s' "$RECIPIENT" | grep -Eq '^[0-9]{8,15}$'; then
            echo "❌ WA_RECIPIENT must contain 8-15 digits in international format."
            echo "Example format: 919876543210"
            exit 1
          fi

          PAYLOAD=$(jq -n             --arg to "$RECIPIENT"             '{
              messaging_product: "whatsapp",
              to: $to,
              type: "template",
              template: {
                name: "hello_world",
                language: {
                  code: "en_US"
                }
              }
            }')

          HTTP_CODE=$(curl             -sS             -X POST             "https://graph.facebook.com/$WA_API_VERSION/$WA_PHONE_NUMBER_ID/messages"             -H "Authorization: Bearer $WA_ACCESS_TOKEN"             -H "Content-Type: application/json"             --data "$PAYLOAD"             -o /tmp/whatsapp_response.json             -w "%{http_code}")

          echo "HTTP status: $HTTP_CODE"
          echo "WhatsApp API response:"
          jq 'del(.error.fbtrace_id)' /tmp/whatsapp_response.json || cat /tmp/whatsapp_response.json

          MESSAGE_ID=$(jq -r '.messages[0].id // empty' /tmp/whatsapp_response.json)

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ] && [ -n "$MESSAGE_ID" ]; then
            echo "✅ WhatsApp test message accepted by Meta."
            echo "Message ID: $MESSAGE_ID"
            exit 0
          fi

          ERROR_CODE=$(jq -r '.error.code // empty' /tmp/whatsapp_response.json)
          ERROR_TYPE=$(jq -r '.error.type // empty' /tmp/whatsapp_response.json)
          ERROR_MESSAGE=$(jq -r '.error.message // empty' /tmp/whatsapp_response.json)

          echo "❌ WhatsApp send failed."
          echo "Error code: $ERROR_CODE"
          echo "Error type: $ERROR_TYPE"
          echo "Error message: $ERROR_MESSAGE"

          exit 1
