name: Publish ONE Instagram Test Post

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    env:
      IG_API_VERSION: "v26.0"
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IMAGE_URL: "https://raw.githubusercontent.com/Anuragdhale27/works-lab-social-automation/main/generated_ads/daily-2026-09-21.jpg"

    steps:
      - name: Verify public image URL
        run: |
          set -euo pipefail

          echo "Checking public image URL..."
          for i in {1..10}; do
            CODE=$(curl -L -sS -o /tmp/image.jpg -w "%{http_code}" "$IMAGE_URL")
            TYPE=$(file -b --mime-type /tmp/image.jpg || true)
            SIZE=$(wc -c < /tmp/image.jpg)

            echo "Attempt $i: HTTP=$CODE type=$TYPE size=$SIZE"

            if [ "$CODE" = "200" ] && [ "$TYPE" = "image/jpeg" ] && [ "$SIZE" -gt 10000 ]; then
              echo "✅ Public image is reachable."
              exit 0
            fi

            sleep 10
          done

          echo "❌ Instagram cannot be tested because the public image URL is not reachable as JPEG."
          exit 1

      - name: Verify Instagram credentials
        run: |
          set -euo pipefail

          if [ -z "${IG_ACCESS_TOKEN:-}" ]; then
            echo "IG_ACCESS_TOKEN is missing."
            exit 1
          fi

          if [ -z "${IG_USER_ID:-}" ]; then
            echo "IG_USER_ID is missing."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
            "https://graph.instagram.com/$IG_API_VERSION/me?fields=user_id,username" \
            -o /tmp/account.json

          RETURNED_ID=$(jq -r '.user_id // empty' /tmp/account.json)
          USERNAME=$(jq -r '.username // empty' /tmp/account.json)

          echo "Instagram username: $USERNAME"

          if [ "$RETURNED_ID" != "$IG_USER_ID" ]; then
            echo "❌ IG_USER_ID does not match the account returned by Meta."
            exit 1
          fi

          echo "✅ Instagram credentials verified."

      - name: Create Instagram media container
        id: container
        run: |
          set -euo pipefail

          CAPTION=$'🚀 Works Lab Instagram API Test\n\nTesting automatic publishing from GitHub Actions.\n\nATS Resume Templates — ₹149\nhttps://resume.workslab.in'

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
            --data-urlencode "image_url=$IMAGE_URL" \
            --data-urlencode "caption=$CAPTION" \
            "https://graph.instagram.com/$IG_API_VERSION/$IG_USER_ID/media" \
            -o /tmp/container.json

          CONTAINER_ID=$(jq -r '.id // empty' /tmp/container.json)

          if [ -z "$CONTAINER_ID" ]; then
            echo "❌ Meta did not return a container ID."
            cat /tmp/container.json
            exit 1
          fi

          echo "Container created successfully."
          echo "container_id=$CONTAINER_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for container to finish processing
        env:
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          set -euo pipefail

          for i in {1..12}; do
            curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
              "https://graph.instagram.com/$IG_API_VERSION/$CONTAINER_ID?fields=status_code,status" \
              -o /tmp/status.json

            STATUS=$(jq -r '.status_code // empty' /tmp/status.json)
            MESSAGE=$(jq -r '.status // empty' /tmp/status.json)

            echo "Attempt $i: status=$STATUS $MESSAGE"

            case "$STATUS" in
              FINISHED|PUBLISHED)
                echo "✅ Container is ready."
                exit 0
                ;;
              ERROR|EXPIRED)
                echo "❌ Container processing failed."
                cat /tmp/status.json
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "❌ Container did not reach FINISHED within the test window."
          exit 1

      - name: Publish Instagram post
        env:
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $IG_ACCESS_TOKEN" \
            --data-urlencode "creation_id=$CONTAINER_ID" \
            "https://graph.instagram.com/$IG_API_VERSION/$IG_USER_ID/media_publish" \
            -o /tmp/published.json

          MEDIA_ID=$(jq -r '.id // empty' /tmp/published.json)

          if [ -z "$MEDIA_ID" ]; then
            echo "❌ Meta did not return a published media ID."
            cat /tmp/published.json
            exit 1
          fi

          echo "✅ Instagram post published successfully."
          echo "Instagram media ID: $MEDIA_ID"
